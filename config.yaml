_schema_version: 1
server:
  port: 0
  host: 127.0.0.1
  cors: true
proxy:
  timeout: 30000
  keep_alive: true
  user_agent_override: ""
  preserve_headers:
    - x-request-id
    - x-ratelimit-*
providers:
  test-openai:
    display_name: Test OpenAI
    base_url: http://localhost:19999/v1
    api_key: sk-test
    protocol: openai
    models:
      - gpt-4o
      - gpt-5
  test-anthropic:
    display_name: Test Anthropic
    base_url: http://localhost:19998
    api_key: sk-ant-test
    protocol: anthropic
    models:
      - claude-sonnet-4-20250514
conversions:
  anthropic_to_openai: true
  openai_to_anthropic: true
  anthropic_to_openai_responses: true
  openai_to_anthropic_responses: false
  openai_chat_to_responses: true
  responses_to_openai_chat: true
logging:
  level: error
  dir: logs
  max_files: 1
